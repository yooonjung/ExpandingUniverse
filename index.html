<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>팽창하는 우주 탐험대</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap">
<style>
/* Layout: 한 줄 기둥(최대 760px) 위에 지도 → 미션(안내 말풍선 · 실험 무대 · 다음 버튼) 순서. 배경은 고정 밤하늘 캔버스 + 떠다니는 행성 */
:root{
  color-scheme: dark;
  --space:#0f1336;
  --space-2:#171c4c;
  --panel:#222a66;
  --panel-2:#2c3579;
  --line:#3f4996;
  --ink:#f7f4ff;
  --muted:#bdb9ea;
  --butter:#ffd66e;
  --pink:#ff9fc3;
  --mint:#80e7c6;
  --sky:#90caff;
  --coral:#ff8b7c;
  --lilac:#c6a9ff;
  --good:#80e7c6;
  --bad:#ff8fa3;
  --on-light:#1c2052;
  --f-display:'Jua','Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --f-body:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;
  --r-lg:26px; --r-md:18px; --r-sm:12px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{
  margin:0;background:var(--space);color:var(--ink);
  font-family:var(--f-body);font-size:17px;line-height:1.6;
  background-image:
    radial-gradient(60% 45% at 85% 10%, rgba(198,169,255,.16), transparent 70%),
    radial-gradient(50% 40% at 5% 60%, rgba(144,202,255,.12), transparent 70%),
    radial-gradient(40% 30% at 70% 95%, rgba(255,159,195,.10), transparent 70%);
  background-attachment:fixed;
  overflow-x:hidden;
}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:60;pointer-events:none}
.floaters{position:fixed;inset:0;z-index:1;opacity:.6;pointer-events:none;overflow:hidden}
.drift{position:absolute;left:-140px;animation:drift linear infinite}
.bob{animation:bob ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(calc(100vw + 280px))}}
@keyframes bob{from{transform:translateY(-12px) rotate(-8deg)}to{transform:translateY(14px) rotate(8deg)}}
.planet{border-radius:50%;position:relative}
.p-ring{width:74px;height:74px;background:radial-gradient(circle at 32% 30%,#fff3c4,var(--butter) 45%,#e8a64c 100%);box-shadow:inset -10px -8px 0 rgba(0,0,0,.12)}
.p-ring::after{content:"";position:absolute;left:-26px;top:28px;width:126px;height:20px;border-radius:50%;border:5px solid rgba(255,159,195,.85);transform:rotate(-14deg);border-top-color:transparent}
.p-pink{width:52px;height:52px;background:radial-gradient(circle at 30% 30%,#ffe0ec,var(--pink) 50%,#d9668f);box-shadow:inset -7px -6px 0 rgba(0,0,0,.12)}
.p-pink::before{content:"";position:absolute;width:12px;height:12px;border-radius:50%;left:26px;top:12px;background:rgba(200,80,130,.35);box-shadow:-14px 16px 0 -2px rgba(200,80,130,.3)}
.p-mint{width:34px;height:34px;background:radial-gradient(circle at 30% 30%,#e3fff5,var(--mint) 55%,#3fae8c)}
.p-lilac{width:44px;height:44px;background:radial-gradient(circle at 30% 30%,#f1e9ff,var(--lilac) 55%,#8a6ad6);box-shadow:inset -6px -5px 0 rgba(0,0,0,.14)}
.p-rocket{font-size:30px;filter:drop-shadow(0 0 6px rgba(255,214,110,.5))}

.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:rgba(15,19,54,.78);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid rgba(63,73,150,.6)}
.hud-in{max-width:760px;margin:0 auto;padding-block:8px;padding-inline:16px;display:flex;align-items:center;gap:10px;justify-content:space-between}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-size:19px;color:var(--ink);min-width:0;background:none;border:0;cursor:pointer;padding:0}
.brand svg{width:34px;height:34px;flex:none}
.brand span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud-r{display:flex;align-items:center;gap:6px;flex:none}
.chip{font-family:var(--f-display);font-size:15px;display:inline-flex;align-items:center;gap:5px;padding:6px 11px;border-radius:999px;background:var(--panel);color:var(--ink);border:1.5px solid var(--line);line-height:1}
button.chip{cursor:pointer}
.chip svg{width:18px;height:18px}
.chip.star b{color:var(--butter);font-variant-numeric:tabular-nums;min-width:2ch;text-align:right}
.chip.rank{background:linear-gradient(135deg,var(--lilac),var(--pink));color:var(--on-light);border-color:transparent}
.chip.icon{padding:6px 8px}
@media (max-width:560px){.brand span{display:none}.chip{font-size:14px;padding:6px 9px}}
@media (max-width:380px){.chip.rank{display:none}}

.app{position:relative;z-index:2;max-width:760px;margin:0 auto;padding-inline:16px;padding-block:22px 80px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;line-height:1.25;margin:0;text-wrap:balance}
h1{font-size:clamp(30px,6vw,44px)}
h2{font-size:clamp(24px,4.6vw,32px)}
h3{font-size:21px}
p{margin:0}
.eyebrow{font-size:14px;color:var(--muted);letter-spacing:.02em}
b,strong{font-weight:400;font-family:var(--f-display);letter-spacing:.01em}
.hl{color:var(--butter)} .hp{color:var(--pink)} .hm{color:var(--mint)} .hs{color:var(--sky)} .hr{color:var(--coral)}

.btn{font-family:var(--f-display);font-size:18px;border:0;cursor:pointer;border-radius:999px;padding:12px 22px;background:var(--butter);color:var(--on-light);box-shadow:0 5px 0 #c99a3a;transition:transform .12s, box-shadow .12s, filter .2s;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn:hover{filter:brightness(1.05)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #c99a3a}
.btn:disabled{background:var(--panel-2);color:var(--muted);box-shadow:0 5px 0 #1b2156;cursor:not-allowed;filter:none}
.btn.ghost{background:var(--panel);color:var(--ink);box-shadow:0 5px 0 #161b4a;border:1.5px solid var(--line)}
.btn.pink{background:var(--pink);box-shadow:0 5px 0 #c4648a}
.btn.mint{background:var(--mint);box-shadow:0 5px 0 #3e9c7f}
.btn.sky{background:var(--sky);box-shadow:0 5px 0 #4f86c2}
.btn.small{font-size:16px;padding:9px 16px}
.btn.pulse:not(:disabled){animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.05)}}
:focus-visible{outline:3px solid var(--sky);outline-offset:3px;border-radius:12px}

.panel{background:rgba(34,42,102,.86);border:1.5px solid var(--line);border-radius:var(--r-lg);padding:20px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* ---------- 지도 ---------- */
.hero{display:flex;gap:16px;align-items:center}
.hero svg.mascot{width:110px;height:110px;flex:none;animation:bob 3s ease-in-out infinite alternate}
.hero .txt{min-width:0;display:flex;flex-direction:column;gap:6px}
.hero p{color:var(--muted)}
.namebox{display:flex;gap:10px;flex-wrap:wrap}
.namebox input{flex:1 1 180px;min-width:0;font-family:var(--f-display);font-size:19px;padding:11px 16px;border-radius:999px;border:2px solid var(--line);background:var(--space-2);color:var(--ink)}
.vote{display:flex;gap:12px;flex-wrap:wrap}
.vote button{flex:1 1 140px;font-family:var(--f-display);font-size:22px;padding:16px;border-radius:var(--r-md);border:2px solid var(--line);background:var(--space-2);color:var(--ink);cursor:pointer;transition:transform .15s}
.vote button:hover{transform:translateY(-3px)}
.vote button small{display:block;font-family:var(--f-body);font-size:14px;color:var(--muted)}
.vote button.sel{border-color:var(--butter);background:rgba(255,214,110,.14)}

.path{position:relative;display:flex;flex-direction:column;gap:14px;padding-block:6px}
.path::before{content:"";position:absolute;left:47px;top:30px;bottom:30px;border-left:3px dashed rgba(189,185,234,.35)}
.node{position:relative;display:flex;align-items:center;gap:16px;text-align:left;width:100%;background:rgba(34,42,102,.82);border:1.5px solid var(--line);border-radius:var(--r-lg);padding:12px 16px 12px 12px;color:var(--ink);cursor:pointer;font:inherit;transition:transform .15s,border-color .2s}
.node:hover:not(:disabled){transform:translateX(4px);border-color:var(--lilac)}
.node:disabled{cursor:not-allowed;opacity:.55}
.node .ball{width:70px;height:70px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:var(--f-display);font-size:28px;color:var(--on-light);box-shadow:inset -8px -7px 0 rgba(0,0,0,.14),0 0 0 5px rgba(15,19,54,.9)}
.node .info{min-width:0;flex:1;display:flex;flex-direction:column;gap:2px}
.node .info h3{font-size:20px}
.node .info .src{font-size:13.5px;color:var(--muted)}
.node .stat{flex:none;font-family:var(--f-display);font-size:14px;padding:5px 10px;border-radius:999px;background:var(--space-2);border:1.5px solid var(--line);white-space:nowrap}
.node .stat.done{background:var(--mint);color:var(--on-light);border-color:transparent}
.node .stat.go{background:var(--butter);color:var(--on-light);border-color:transparent;animation:pulse 1.6s infinite}
@media (max-width:480px){.node .stat{display:none}.node .ball{width:58px;height:58px;font-size:24px}.path::before{left:41px}}
.foot{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.linkish{background:none;border:0;color:var(--muted);font:inherit;font-size:14px;text-decoration:underline;cursor:pointer;padding:6px}

/* ---------- 미션 ---------- */
.mhead{display:flex;gap:12px;align-items:flex-start}
.mhead .txt{min-width:0;flex:1}
.back{flex:none}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dots i{width:28px;height:8px;border-radius:99px;background:var(--panel-2)}
.dots i.on{background:var(--butter)}
.dots i.past{background:var(--lilac)}
.guide{display:flex;gap:12px;align-items:flex-end}
.guide svg{width:72px;height:72px;flex:none}
.bubble{position:relative;background:var(--ink);color:var(--on-light);border-radius:22px 22px 22px 6px;padding:13px 17px;font-size:17px;line-height:1.55;min-width:0;flex:1}
.bubble b{color:#6b3fd0}
.stage{display:flex;flex-direction:column;gap:16px}
.nav{display:flex;justify-content:space-between;gap:12px}

.card{background:rgba(34,42,102,.88);border:1.5px solid var(--line);border-radius:var(--r-lg);padding:18px;display:flex;flex-direction:column;gap:12px}
.card p{color:var(--ink)}
.card .note{font-size:15px;color:var(--muted)}
.simcv{width:100%;display:block;border-radius:var(--r-md);background:rgba(10,13,40,.75);border:1.5px solid var(--line);touch-action:manipulation}
.ctrl{display:flex;flex-direction:column;gap:6px}
.ctrl label{font-family:var(--f-display);font-size:16px}
.slider-row{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
.slider-row span{flex:none}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;min-width:0;height:14px;border-radius:99px;background:linear-gradient(90deg,var(--sky),var(--lilac),var(--coral));outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:50%;background:var(--ink);border:4px solid var(--butter);box-shadow:0 2px 8px rgba(0,0,0,.4);cursor:grab}
input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:var(--ink);border:4px solid var(--butter);cursor:grab}
.tasks{display:flex;gap:8px;flex-wrap:wrap}
.task{font-family:var(--f-display);font-size:15px;padding:7px 13px;border-radius:999px;border:1.5px dashed var(--line);color:var(--muted)}
.task.ok{border-style:solid;border-color:transparent;background:var(--mint);color:var(--on-light)}
.status{font-family:var(--f-display);font-size:17px;text-align:center;min-height:1.6em}

/* 표 */
.tbl-wrap{overflow-x:auto}
table.rec{width:100%;border-collapse:separate;border-spacing:0;font-variant-numeric:tabular-nums;min-width:380px}
table.rec th,table.rec td{padding:9px 8px;text-align:center;border-bottom:1.5px solid var(--line)}
table.rec th{font-family:var(--f-display);font-weight:400;color:var(--muted);font-size:15px}
table.rec td.v{font-family:var(--f-display);font-size:18px}
table.rec td.pop{animation:pop .5s}
@keyframes pop{40%{transform:scale(1.35);color:var(--butter)}}
table.rec input{width:72px;font-family:var(--f-display);font-size:18px;text-align:center;padding:6px;border-radius:10px;border:2px solid var(--line);background:var(--space-2);color:var(--ink)}
table.rec input.ok{border-color:var(--good);background:rgba(128,231,198,.15)}
table.rec input.no{border-color:var(--bad);background:rgba(255,143,163,.12)}
.choice{display:inline-flex;gap:6px;vertical-align:middle}
.pill{font-family:var(--f-display);font-size:17px;padding:6px 14px;border-radius:999px;border:2px solid var(--line);background:var(--space-2);color:var(--ink);cursor:pointer}
.pill.sel{border-color:var(--butter);background:rgba(255,214,110,.16)}
.pill.right{border-color:var(--good);background:var(--good);color:var(--on-light)}
.pill.wrong{border-color:var(--bad);color:var(--bad)}

/* 퀴즈 */
.qcard{background:linear-gradient(160deg,rgba(44,53,121,.95),rgba(34,42,102,.95));border:2px solid var(--line);border-radius:var(--r-lg);padding:18px;display:flex;flex-direction:column;gap:14px}
.qtag{align-self:flex-start;font-family:var(--f-display);font-size:14px;padding:4px 12px;border-radius:999px;background:var(--pink);color:var(--on-light)}
.qprompt{font-size:19px;line-height:1.6}
.qopts{display:flex;flex-direction:column;gap:9px}
.qopt{text-align:left;font:inherit;font-size:17px;padding:12px 16px;border-radius:var(--r-md);border:2px solid var(--line);background:var(--space-2);color:var(--ink);cursor:pointer;display:flex;gap:10px;align-items:flex-start;transition:transform .12s,border-color .2s}
.qopt:hover:not(:disabled){border-color:var(--lilac);transform:translateX(3px)}
.qopt .k{font-family:var(--f-display);flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--panel-2);font-size:15px}
.qopt.right{border-color:var(--good);background:rgba(128,231,198,.18)}
.qopt.right .k{background:var(--good);color:var(--on-light)}
.qopt.wrong{border-color:var(--bad);opacity:.7;animation:shake .4s}
.qopt.on{border-color:var(--butter);background:rgba(255,214,110,.12)}
.qopt.on .k{background:var(--butter);color:var(--on-light)}
.qopt:disabled{cursor:default}
.oxrow{display:flex;gap:14px}
.oxrow .qopt{flex:1;justify-content:center;font-family:var(--f-display);font-size:44px;padding:12px}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.qfb{border-radius:var(--r-md);padding:0;font-size:16px}
.qfb.good{background:rgba(128,231,198,.14);border:1.5px solid var(--good);padding:12px 14px}
.qfb.bad{background:rgba(255,143,163,.1);border:1.5px solid var(--bad);padding:12px 14px}
.qfb b{font-size:18px}
.qfb.good b{color:var(--good)} .qfb.bad b{color:var(--bad)}
.pts{font-family:var(--f-display);color:var(--butter);margin-left:6px}
.slot{display:inline-block;min-width:3.6em;text-align:center;padding:0 8px;margin:0 2px;border-bottom:2.5px solid var(--butter);font-family:var(--f-display);color:var(--butter)}
.slot.ok{color:var(--good);border-color:var(--good)} .slot.no{color:var(--bad);border-color:var(--bad)}
.brow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.blab{font-family:var(--f-display);color:var(--butter);width:26px}
.fig{display:block;max-width:100%;border-radius:var(--r-sm);margin:0 auto}
.figwrap{display:flex;justify-content:center}
.bogi{border:1.5px solid var(--line);border-radius:var(--r-sm);padding:10px 14px;font-size:16px;background:rgba(15,19,54,.5)}

/* 도감 */
.dex{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:560px){.dex{grid-template-columns:repeat(2,1fr)}}
.dex .slotc{background:var(--space-2);border:1.5px solid var(--line);border-radius:var(--r-md);padding:8px;display:flex;flex-direction:column;gap:4px;align-items:center;text-align:center;min-width:0}
.dex .slotc canvas{width:100%;max-width:120px;aspect-ratio:1;border-radius:12px;background:#0a0d28}
.dex .slotc h4{margin:0;font-family:var(--f-display);font-weight:400;font-size:16px}
.dex .slotc p{font-size:13px;color:var(--muted);line-height:1.4}
.dex .slotc.lock canvas{filter:brightness(0) opacity(.35)}
.optgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.optgrid .qopt{justify-content:center;font-family:var(--f-display);font-size:18px}

.split{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.split{grid-template-columns:1fr}}
.mini{background:var(--space-2);border:1.5px solid var(--line);border-radius:var(--r-md);padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.mini h4{margin:0;font-family:var(--f-display);font-weight:400;font-size:17px}
.mini ul{margin:0;padding-left:18px;font-size:15px}
.obsbtns{display:flex;gap:8px;flex-wrap:wrap}
.obsbtns button{font-family:var(--f-display);font-size:18px;width:52px;height:52px;border-radius:50%;border:2.5px solid var(--line);background:var(--space-2);color:var(--ink);cursor:pointer;position:relative}
.obsbtns button.cur{border-color:var(--butter);background:rgba(255,214,110,.18)}
.obsbtns button.seen::after{content:"✓";position:absolute;right:-4px;top:-4px;width:20px;height:20px;border-radius:50%;background:var(--mint);color:var(--on-light);font-size:13px;display:grid;place-items:center}
.dist{font-size:15px;font-variant-numeric:tabular-nums;display:flex;flex-direction:column;gap:3px}
.dist div{display:flex;justify-content:space-between;gap:8px}
.dist .up{color:var(--coral);font-family:var(--f-display)}
.gauges{display:flex;flex-direction:column;gap:8px}
.gauge{display:grid;grid-template-columns:48px 1fr;gap:10px;align-items:center;font-family:var(--f-display);font-size:15px}
.gauge .bar{height:16px;border-radius:99px;background:var(--space-2);border:1.5px solid var(--line);overflow:hidden}
.gauge .bar i{display:block;height:100%;border-radius:99px;transition:width .1s}
.siren{position:relative;height:112px;border-radius:var(--r-md);background:rgba(10,13,40,.75);border:1.5px solid var(--line);overflow:hidden}
.siren .car{position:absolute;top:14px;left:-90px}
.siren .beacon{fill:#ff5a5a;animation:beacon .4s steps(1) infinite}
@keyframes beacon{50%{fill:#5aa8ff}}
.siren .me{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);font-size:34px}
.siren .lbl{position:absolute;bottom:8px;font-family:var(--f-display);font-size:14px}
.siren .lbl.l{left:12px;color:var(--sky)} .siren .lbl.r{right:12px;color:var(--coral)}

/* 모달 / 토스트 */
#modal{position:fixed;inset:0;z-index:70;background:rgba(8,10,30,.72);display:grid;place-items:center;padding:16px}
.mbox{background:var(--panel);border:2px solid var(--line);border-radius:30px;padding:24px;max-width:460px;width:100%;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center;max-height:90vh;overflow:auto;animation:popin .4s cubic-bezier(.2,1.6,.4,1)}
@keyframes popin{from{transform:scale(.6);opacity:0}}
.mbox .big{width:150px;height:150px;animation:spin-in .9s cubic-bezier(.2,1.4,.4,1)}
@keyframes spin-in{from{transform:rotate(-200deg) scale(.2)}}
.book{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%}
.book div{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;color:var(--muted)}
.book svg{width:84px;height:84px}
.book .lock svg{filter:grayscale(1) brightness(.45)}

/* 포포 꾸미기 */
.shop{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:16px;align-items:start}

.wallet svg{width:24px;height:24px}

.slotgrp h4{margin:0;font-family:var(--f-display);font-weight:400;font-size:18px}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.item{font:inherit;background:var(--space-2);border:2px solid var(--line);border-radius:var(--r-md);padding:8px 6px;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;transition:transform .12s,border-color .2s}

.item .nm{font-family:var(--f-display);font-size:15px}
.item .pr{font-family:var(--f-display);font-size:13px;color:var(--butter)}
.item.own .pr{color:var(--muted)}
.item.on{border-color:var(--butter);background:rgba(255,214,110,.14)}
.item.on .pr{color:var(--mint)}
.item.poor{opacity:.55}
.item.nope{animation:shake .4s}
.pp .twk{animation:twk 1.6s ease-in-out infinite}
.pp .twk:nth-child(2n){animation-delay:.8s}
@keyframes twk{50%{opacity:.15}}

/* 수료증 */

<script>
(function(){
'use strict';
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const app=$('#app');
const RM=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const LET=['㉠','㉡','㉢','㉣'];

/* ================= 상태 ================= */
const KEY='expanding-universe-v1';
const FRESH=()=>({name:'',stars:0,done:{},stickers:[],vote1:null,vote2:null,solved:{},mstars:{},streak:0,sound:true,c4:null,spent:0,owned:['c-purple'],equip:{color:'c-purple'}});
let S=FRESH();
try{const raw=localStorage.getItem(KEY);if(raw)S=Object.assign(S,JSON.parse(raw));}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}

const RANKS=[[0,'우주 새내기'],[60,'꼬마 천문학자'],[140,'은하 탐험가'],[220,'우주 박사'],[300,'허블의 후계자']];
function rankOf(n){let r=RANKS[0][1];for(const [t,nm] of RANKS) if(n>=t) r=nm;return r;}

/* ================= 소리 ================= */
let AC=null;
function ac(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();}catch(e){AC=null}return AC;}
function tone(f,dur,type,vol,when,force){
  if(!S.sound&&!force)return;const c=ac();if(!c)return;
  const t=c.currentTime+(when||0);const o=c.createOscillator(),g=c.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||0.12,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g).connect(c.destination);o.start(t);o.stop(t+dur+0.05);
}
function sfx(k){
  if(k==='good'){tone(660,.18,'triangle',.13);tone(990,.28,'triangle',.13,.11);}
  else if(k==='bad'){tone(240,.25,'sine',.12);tone(200,.3,'sine',.1,.12);}
  else if(k==='star'){[1320,1760,2350].forEach((f,i)=>tone(f,.15,'sine',.06,i*.06));}
  else if(k==='win'){[523,659,784,1047,1319].forEach((f,i)=>tone(f,.3,'triangle',.11,i*.1));}
  else if(k==='pop'){tone(880,.08,'square',.05);}
  else if(k==='boom'){const c=ac();if(!c||!S.sound)return;const len=c.sampleRate*1.2,b=c.createBuffer(1,len,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.2);const s=c.createBufferSource();s.buffer=b;const f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=700;const g=c.createGain();g.gain.value=.5;s.connect(f).connect(g).connect(c.destination);s.start();}
}
/* 사이렌: 구급차가 왼쪽에서 오른쪽으로 지나갈 때의 도플러 효과.
   위치에 따라 높낮이가 '서서히' 바뀌고(다가올 때 높게 → 멀어질 때 낮게), 가까울수록 크게 들린다. */
const SIREN_T=3.6;
function siren(){
  const c=ac();if(!c)return;
  const t0=c.currentTime+.06,T=SIREN_T,L=1,y0=.16,beta=.1,dt=.02;
  const o=c.createOscillator(),o2=c.createOscillator(),lp=c.createBiquadFilter(),g=c.createGain(),g2=c.createGain();
  o.type='triangle';o2.type='sine';g2.gain.value=.35;
  lp.type='lowpass';lp.frequency.value=2600;
  o.connect(lp);o2.connect(g2).connect(lp);lp.connect(g).connect(c.destination);
  g.gain.setValueAtTime(.0001,t0);
  for(let k=0;k*dt<=T;k++){
    const t=k*dt,x=-L+2*L*t/T,r=Math.hypot(x,y0);
    const toward=-x/r;                       // 듣는 사람 쪽으로 다가오는 정도 (+: 다가옴, -: 멀어짐)
    const dop=1/(1-beta*toward);             // 도플러 배율
    const base=(Math.floor(t/.4)%2)?660:880; // 삐-뽀
    o.frequency.setValueAtTime(base*dop,t0+t);o2.frequency.setValueAtTime(base*2*dop,t0+t);
    g.gain.linearRampToValueAtTime(Math.max(.002,.26/(1+Math.pow(r/.32,2))),t0+t);
  }
  g.gain.linearRampToValueAtTime(.0001,t0+T+.08);
  o.start(t0);o2.start(t0);o.stop(t0+T+.15);o2.stop(t0+T+.15);
  return t0;
}

/* ================= HUD / 보상 ================= */
function hud(){
  $('#starCount').textContent=S.stars;
  $('#rankChip').textContent=rankOf(S.stars);
  $('#stCount').textContent=S.stickers.length;
  $('#sndBtn').innerHTML=`<svg><use href="#${S.sound?'ico-snd':'ico-mute'}"/></svg>`;
}
let toastT=0;
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2300);}
function flyStar(fromEl,n){
  const tgt=$('#starChip').getBoundingClientRect();
  let x=window.innerWidth/2,y=window.innerHeight/2;
  if(fromEl&&fromEl.getBoundingClientRect){const r=fromEl.getBoundingClientRect();x=r.left+r.width/2;y=r.top+r.height/2;}
  const s=document.createElement('div');s.className='flystar';s.textContent='★ +'+n;
  s.style.left=x+'px';s.style.top=y+'px';document.body.appendChild(s);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{s.style.transform=`translate(${tgt.left-x}px,${tgt.top-y}px) scale(.6)`;s.style.opacity='.2';}));
  setTimeout(()=>{s.remove();const c=$('#starChip');c.animate([{transform:'scale(1)'},{transform:'scale(1.25)'},{transform:'scale(1)'}],{duration:350});},820);
}
let curMid=null;
function addStars(n,el){
  const before=rankOf(S.stars);S.stars+=n;if(curMid)S.mstars[curMid]=(S.mstars[curMid]||0)+n;save();
  flyStar(el,n);setTimeout(()=>{hud();sfx('star');},800);
  const after=rankOf(S.stars);
  if(after!==before)setTimeout(()=>{toast('등급 업! 이제 「'+after+'」예요');sfx('win');burst(window.innerWidth-80,40,60);},1100);
}
function gain(id,n,el){if(S.solved[id])return false;S.solved[id]=true;addStars(n,el);return true;}

/* ================= 화면 효과: 밤하늘 / 꽃가루 ================= */
const sky=$('#sky'),sctx=sky.getContext('2d');let SW=0,SH=0,stars=[],shoot=null,shootT=3;
function fitSky(){const d=Math.min(2,window.devicePixelRatio||1);SW=window.innerWidth;SH=window.innerHeight;sky.width=SW*d;sky.height=SH*d;sctx.setTransform(d,0,0,d,0,0);
  const n=Math.round(SW*SH/5200);stars=[];for(let i=0;i<n;i++)stars.push({x:Math.random()*SW,y:Math.random()*SH,r:Math.random()*1.5+.3,ph:Math.random()*6.28,sp:.6+Math.random()*1.8,c:pick(['#ffffff','#fff3c4','#dcd0ff','#cfe8ff','#ffd9e8'])});}
function drawSky(dt,t){
  sctx.clearRect(0,0,SW,SH);
  for(const s of stars){
    if(!RM){s.x-=dt*3*s.r;if(s.x<-2)s.x=SW+2;}
    const a=RM?.8:.45+.55*Math.abs(Math.sin(t*s.sp+s.ph));
    sctx.globalAlpha=a;sctx.fillStyle=s.c;sctx.beginPath();sctx.arc(s.x,s.y,s.r,0,6.283);sctx.fill();
    if(s.r>1.5){sctx.globalAlpha=a*.5;sctx.fillRect(s.x-s.r*2.4,s.y-.4,s.r*4.8,.8);sctx.fillRect(s.x-.4,s.y-s.r*2.4,.8,s.r*4.8);}
  }
  sctx.globalAlpha=1;
  if(!RM){
    shootT-=dt;
    if(shootT<=0&&!shoot){shoot={x:Math.random()*SW*.8+SW*.2,y:Math.random()*SH*.4,vx:-420,vy:200,life:1};shootT=5+Math.random()*7;}
    if(shoot){shoot.x+=shoot.vx*dt;shoot.y+=shoot.vy*dt;shoot.life-=dt*1.1;
      const g=sctx.createLinearGradient(shoot.x,shoot.y,shoot.x-shoot.vx*.25,shoot.y-shoot.vy*.25);
      g.addColorStop(0,'rgba(255,246,216,'+Math.max(0,shoot.life)+')');g.addColorStop(1,'rgba(255,246,216,0)');
      sctx.strokeStyle=g;sctx.lineWidth=2;sctx.beginPath();sctx.moveTo(shoot.x,shoot.y);sctx.lineTo(shoot.x-shoot.vx*.25,shoot.y-shoot.vy*.25);sctx.stroke();
      if(shoot.life<=0)shoot=null;}
  }
}
const fx=$('#fx'),fctx=fx.getContext('2d');let parts=[];
function fitFx(){const d=Math.min(2,window.devicePixelRatio||1);fx.width=window.innerWidth*d;fx.height=window.innerHeight*d;fctx.setTransform(d,0,0,d,0,0);}
function burst(x,y,n){
  const cols=['#ffd66e','#ff9fc3','#80e7c6','#90caff','#c6a9ff','#ffffff'];
  for(let i=0;i<(RM?Math.min(n,20):n);i++){const a=Math.random()*6.283,v=150+Math.random()*380;
    parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-220,r:3+Math.random()*5,c:pick(cols),rot:Math.random()*6,vr:(Math.random()-.5)*10,life:1.6+Math.random(),star:Math.random()<.4});}
}
function drawFx(dt){
  fctx.clearRect(0,0,fx.width,fx.height);if(!parts.length)return;
  for(const p of parts){p.vy+=520*dt;p.vx*=.99;p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;p.life-=dt;
    fctx.save();fctx.globalAlpha=clamp(p.life,0,1);fctx.translate(p.x,p.y);fctx.rotate(p.rot);fctx.fillStyle=p.c;
    if(p.star){starPath(fctx,0,0,p.r*1.6,p.r*.7);fctx.fill();}else fctx.fillRect(-p.r,-p.r*.5,p.r*2,p.r);
    fctx.restore();}
  parts=parts.filter(p=>p.life>0&&p.y<window.innerHeight+40);
}

function makeCanvas(parent,hf){
  const cv=document.createElement('canvas');cv.className='simcv';parent.appendChild(cv);
  const o={cv,ctx:cv.getContext('2d'),w:300,h:200};
  const fit=()=>{const w=Math.max(200,cv.clientWidth||parent.clientWidth||320);const h=typeof hf==='function'?hf(w):hf;const d=Math.min(2,window.devicePixelRatio||1);
    o.w=w;o.h=h;cv.style.height=h+'px';cv.width=Math.round(w*d);cv.height=Math.round(h*d);o.ctx.setTransform(d,0,0,d,0,0);if(o.onfit)o.onfit();};
  fit();if(window.ResizeObserver)new ResizeObserver(()=>{if(Math.abs((cv.clientWidth||0)-o.w)>1)fit();}).observe(cv);
  return o;
}
function rng(seed){let s=(seed*2654435761)>>>0||1;return()=>{s^=s<<13;s>>>=0;s^=s>>>17;s^=s<<5;s>>>=0;return (s%1000000)/1000000;};}
function cssv(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}

/* 은하 그리기 (타원 E / 정상 나선 S / 막대 나선 SB / 불규칙 Irr) */
function drawGalaxy(c,type,x,y,r,seed,rot){
  const R=rng(seed||1);c.save();c.translate(x,y);c.rotate(rot||0);c.globalCompositeOperation='lighter';
  const glow=(cx,cy,rad,col,a)=>{const g=c.createRadialGradient(cx,cy,0,cx,cy,rad);g.addColorStop(0,`rgba(${col},${a})`);g.addColorStop(1,`rgba(${col},0)`);c.fillStyle=g;c.beginPath();c.arc(cx,cy,rad,0,6.283);c.fill();};
  if(type==='E'){
    c.scale(1,.62);
    glow(0,0,r,'255,214,160',.55);glow(0,0,r*.55,'255,232,190',.75);glow(0,0,r*.22,'255,250,235',1);
  }else if(type==='S'||type==='SB'){
    c.scale(1,.82);const bar=type==='SB';
    glow(0,0,r*.9,'150,170,255',.18);
    if(bar){c.save();c.scale(1,.28);glow(0,0,r*.5,'255,236,200',.9);c.restore();}
    glow(0,0,r*(bar?.2:.26),'255,240,210',1);
    const start=bar?r*.42:r*.1;
    for(let arm=0;arm<2;arm++){
      for(let i=0;i<170;i++){const t=i/170;const th=t*3.3+arm*Math.PI;const rad=start+t*(r*.95-start);
        const j=(R()-.5)*r*.14*(0.4+t);const px=Math.cos(th)*rad+j,py=Math.sin(th)*rad+(R()-.5)*r*.14*(0.4+t);
        const s=R()*1.6+.5;c.fillStyle=R()<.15?'rgba(255,170,210,.8)':`rgba(${190+R()*60|0},${210+R()*40|0},255,${.35+R()*.5})`;
        c.beginPath();c.arc(px,py,s*(r/40),0,6.283);c.fill();}
    }
  }else{
    for(let k=0;k<7;k++){const cx=(R()-.5)*r*1.1,cy=(R()-.5)*r*.9;glow(cx,cy,r*(.18+R()*.25),R()<.5?'170,190,255':'255,180,220',.55);}
    for(let i=0;i<120;i++){const a=R()*6.283,d=Math.pow(R(),.7)*r*.75;c.fillStyle=`rgba(220,230,255,${.3+R()*.5})`;c.beginPath();c.arc(Math.cos(a)*d*1.2,Math.sin(a)*d*.8,(R()*1.2+.4)*(r/40),0,6.283);c.fill();}
  }
  c.restore();
}
const spriteCache={};
function sprite(type,size,seed,rot){
  const k=type+size+'_'+seed+'_'+(rot||0);if(spriteCache[k])return spriteCache[k];
  const cv=document.createElement('canvas');cv.width=cv.height=size*2;const c=cv.getContext('2d');
  drawGalaxy(c,type,size,size,size*.92,seed,rot||0);spriteCache[k]=cv;return cv;
}

/* 정답 위치를 문제마다 고르게 흩어 놓기 (같은 문제는 항상 같은 배치) */
function hashStr(t){let h=2166136261;for(const ch of t){h^=ch.charCodeAt(0);h=Math.imul(h,16777619);}return h>>>0;}
const POS_OVERRIDE={};
function place(n,ans,key){const tgt=(key in POS_OVERRIDE?POS_OVERRIDE[key]:hashStr(key))%n;const rest=[];for(let i=0;i<n;i++)if(i!==ans)rest.push(i);rest.splice(tgt,0,ans);return rest;}
function quiz(box,q,done){
  let tries=0,locked=false;
  const card=document.createElement('div');card.className='qcard';box.appendChild(card);
  card.innerHTML=`<span class="qtag">${q.tag||'퀴즈'}</span><div class="qprompt">${q.prompt}</div>${q.fig||''}<div class="qbody"></div><div class="qfb" aria-live="polite"></div>`;
  const body=$('.qbody',card),fb=$('.qfb',card);
  const already=!!S.solved[q.id];
  function win(el){
    locked=true;const pts=tries===0?10:5;
    let bonus='';
    if(!S.solved[q.id]){
      if(tries===0){S.streak=(S.streak||0)+1;}
      gain(q.id,pts,el);
      if(tries===0&&S.streak>0&&S.streak%3===0){setTimeout(()=>{addStars(5,el);toast(S.streak+'문제 연속 정답! 보너스 +5');},500);bonus=' · 연속 정답 보너스 +5';}
    }
    fb.className='qfb good';
    fb.innerHTML=`<b>${pick(['정답이에요!','딩동댕!','바로 그거예요!','훌륭해요!'])}</b>${already?'':`<span class="pts">★ +${pts}${bonus}</span>`}<p>${q.explain}</p>`;
    sfx('good');if(!RM){const r=el.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,26);}
    done&&done();
  }
  function lose(msg){tries++;S.streak=0;save();fb.className='qfb bad';fb.innerHTML=`<b>${pick(['아깝다!','다시 한 번!','조금만 더 생각해 봐요!'])}</b><p>${msg||q.hint||'다시 생각해 볼까요?'}</p>`;sfx('bad');}

  if(q.type==='mc'||q.type==='ox'){
    const wrap=document.createElement('div');wrap.className=q.type==='ox'?'oxrow':'qopts';body.appendChild(wrap);
    const keys=q.keys||['1','2','3','4','5'];
    const ord=q.type==='ox'?q.options.map((_,i)=>i):place(q.options.length,q.answer,q.id);
    ord.forEach((i,pos)=>{const t=q.options[i];const b=document.createElement('button');b.className='qopt';b.type='button';
      b.innerHTML=q.type==='ox'?t:`<span class="k">${keys[pos]}</span><span>${t}</span>`;
      b.onclick=()=>{if(locked)return;if(i===q.answer){b.classList.add('right');$$('.qopt',wrap).forEach(x=>x.disabled=true);win(b);}else{b.classList.add('wrong');b.disabled=true;lose(q.hints&&q.hints[i]);}};
      wrap.appendChild(b);});
  }else if(q.type==='multi'){
    const wrap=document.createElement('div');wrap.className='qopts';body.appendChild(wrap);const on=new Set();
    q.options.forEach((t,i)=>{const b=document.createElement('button');b.className='qopt';b.type='button';b.setAttribute('aria-pressed','false');
      b.innerHTML=`<span class="k">${q.keys[i]}</span><span>${t}</span>`;
      b.onclick=()=>{if(locked)return;if(on.has(i)){on.delete(i);b.classList.remove('on');b.setAttribute('aria-pressed','false');}else{on.add(i);b.classList.add('on');b.setAttribute('aria-pressed','true');}};wrap.appendChild(b);});
    const chk=document.createElement('button');chk.className='btn small';chk.textContent='정답 확인';chk.type='button';body.appendChild(chk);
    chk.onclick=()=>{if(locked)return;if(!on.size){lose('맞는 것을 모두 골라 주세요.');tries--;return;}
      const ok=on.size===q.answer.length&&q.answer.every(a=>on.has(a));
      if(ok){$$('.qopt',wrap).forEach((b,i)=>{b.disabled=true;if(on.has(i)){b.classList.remove('on');b.classList.add('right');}});chk.disabled=true;win(chk);}
      else lose(q.hint);};
  }else if(q.type==='blank'){
    const sel=q.blanks.map(()=>null);
    $('.qprompt',card).innerHTML=q.prompt.replace(/\{(\d)\}/g,(m,i)=>`<span class="slot" data-i="${i}">${LET[i]}</span>`);
    q.blanks.forEach((bl,i)=>{const row=document.createElement('div');row.className='brow';row.innerHTML=`<span class="blab">${LET[i]}</span>`;
      place(bl.opts.length,bl.ans,q.id+'#'+i).forEach(j=>{const o=bl.opts[j];const p=document.createElement('button');p.type='button';p.className='pill';p.textContent=o;
        p.onclick=()=>{if(locked)return;sel[i]=j;$$('.pill',row).forEach(x=>x.classList.remove('sel','wrong'));p.classList.add('sel');const sl=$(`.slot[data-i="${i}"]`,card);sl.textContent=o;sl.classList.remove('no');sfx('pop');};
        row.appendChild(p);});body.appendChild(row);});
    const chk=document.createElement('button');chk.className='btn small';chk.textContent='정답 확인';chk.type='button';body.appendChild(chk);
    chk.onclick=()=>{if(locked)return;if(sel.some(v=>v===null)){fb.className='qfb bad';fb.innerHTML='<b>빈칸이 남았어요</b><p>모든 빈칸을 채운 뒤 눌러 주세요.</p>';return;}
      let all=true;q.blanks.forEach((bl,i)=>{const sl=$(`.slot[data-i="${i}"]`,card);if(sel[i]===bl.ans){sl.classList.add('ok');}else{all=false;sl.classList.add('no');}});
      if(all){$$('.pill',body).forEach(p=>p.disabled=true);chk.disabled=true;win(chk);}else lose(q.hint);};
  }
  return card;
}

    for(let x=ox%step;x<W;x+=step){g.beginPath();g.moveTo(x,0);g.lineTo(x,H);g.stroke();}
    for(let y=oy%step;y<H;y+=step){g.beginPath();g.moveTo(0,y);g.lineTo(W,y);g.stroke();}
    const op=toScr(obs);
    for(const n in GAL){if(n===obs)continue;
      const gx=W/2+(GAL[n][0]-vc[0])*scale,gy=H/2+(GAL[n][1]-vc[1])*scale;const p=toScr(n);
      g.strokeStyle='rgba(189,185,234,.4)';g.setLineDash([3,4]);g.beginPath();g.arc(gx,gy,9,0,6.283);g.stroke();g.beginPath();g.moveTo(gx,gy);g.lineTo(p[0],p[1]);g.stroke();g.setLineDash([]);
      const dx=p[0]-op[0],dy=p[1]-op[1],L=Math.hypot(dx,dy)||1;const al=L*.28;const ux=dx/L,uy=dy/L;const ax=p[0]+ux*22,ay=p[1]+uy*22;
      g.strokeStyle='#ff8b7c';g.lineWidth=3.5;g.beginPath();g.moveTo(ax,ay);g.lineTo(ax+ux*al,ay+uy*al);g.stroke();
      g.fillStyle='#ff8b7c';g.beginPath();g.moveTo(ax+ux*(al+10),ay+uy*(al+10));g.lineTo(ax+ux*al-uy*7,ay+uy*al+ux*7);g.lineTo(ax+ux*al+uy*7,ay+uy*al-ux*7);g.fill();
    }
    for(const n in GAL){const p=toScr(n);const sp=GSPR[n];g.drawImage(sprite(sp[0],40,sp[1],sp[2]),p[0]-26,p[1]-26,52,52);
      g.fillStyle=n===obs?'#ffd66e':'#f7f4ff';g.font='19px Jua, sans-serif';g.textAlign='center';g.fillText(n,p[0]-22,p[1]-18);}
    g.strokeStyle='#ffd66e';g.lineWidth=3;g.beginPath();g.arc(op[0],op[1],30+(RM?0:Math.sin(performance.now()/250)*3),0,6.283);g.stroke();
    g.fillStyle='#ffd66e';g.font='14px Jua, sans-serif';g.fillText('관측자',op[0],op[1]+46);
    g.fillStyle='#bdb9ea';g.font='13px Gowun Dodum, sans-serif';g.textAlign='left';g.fillText('빨간 화살표: 멀어지는 방향과 빠르기 · 점선 원: 처음 위치',10,H-10);
    // 거리 목록
    const rows=Object.keys(GAL).filter(n=>n!==obs).map(n=>{const d0=Math.hypot(GAL[n][0]-GAL[obs][0],GAL[n][1]-GAL[obs][1]);return [n,d0,d0*s];});
    $('#dlist',c).innerHTML=rows.map(r=>`<div><span>은하 ${r[0]}</span><span>${r[1].toFixed(1)}칸 → ${r[2].toFixed(1)}칸 <span class="up">${s>1.01?'멀어짐':''}</span></span></div>`).join('');
    // 그래프
    const q=ch.ctx,cw=ch.w,chh=ch.h;q.clearRect(0,0,cw,chh);const pl=34,pb=26,pr=10,pt=10;const xm=6,ym=5;
    q.strokeStyle='#3f4996';q.lineWidth=1.5;q.beginPath();q.moveTo(pl,pt);q.lineTo(pl,chh-pb);q.lineTo(cw-pr,chh-pb);q.stroke();
    q.fillStyle='#bdb9ea';q.font='12px Gowun Dodum, sans-serif';q.textAlign='center';q.fillText('처음 거리(칸)',(pl+cw-pr)/2,chh-6);

    const X=v=>pl+(cw-pl-pr)*v/xm,Y=v=>chh-pb-(chh-pb-pt)*v/ym;
    q.strokeStyle='rgba(255,214,110,.5)';q.setLineDash([4,4]);q.beginPath();q.moveTo(X(0),Y(0));q.lineTo(X(xm),Y(xm*(s-1)));q.stroke();q.setLineDash([]);
    rows.forEach(r=>{q.fillStyle='#ff8b7c';q.beginPath();q.arc(X(r[1]),Y(r[2]-r[1]),5,0,6.283);q.fill();q.fillStyle='#f7f4ff';q.fillText(r[0],X(r[1]),Y(r[2]-r[1])-8);});

/* ================= 미션 5: 시간 되돌리기 ================= */
function rewindSim(box,done){
  const c=card(`<h3>타임머신 슬라이더</h3>`);box.appendChild(c);
  const o=makeCanvas(c,w=>clamp(w*.62,260,360));
  c.insertAdjacentHTML('beforeend',`<div class="ctrl"><label for="tsl" id="tlab">현재의 우주</label><div class="slider-row"><span>138억 년 전</span><input type="range" id="tsl" min="0" max="1000" value="1000"><span>현재</span></div></div>
    <div class="row"><button class="btn sky small" id="rw">⏪ 끝까지 되감기</button><button class="btn pink small" id="ff" disabled>▶ 다시 팽창시키기</button></div>
    <div class="gauges"><div class="gauge">크기<div class="bar"><i id="gS" style="background:var(--sky)"></i></div></div><div class="gauge">온도<div class="bar"><i id="gT" style="background:var(--coral)"></i></div></div><div class="gauge">밀도<div class="bar"><i id="gD" style="background:var(--lilac)"></i></div></div></div>
    <p class="note">이 그림은 ‘모든 은하 사이의 거리가 줄어든다’는 것을 보여 주는 모형이에요. 우주 바깥에서 우주를 볼 수 있다거나, 그림의 한가운데가 우주의 중심이라는 뜻은 아니에요.</p>`);
  const sl=$('#tsl',c);let f=1,auto=null,flash=0,banged=!!S.solved['m5-bang'];
  const R=rng(21);const pts=[];for(let i=0;i<46;i++){const a=R()*6.283,d=Math.sqrt(R())*.88;pts.push([Math.cos(a)*d,Math.sin(a)*d,pick(['S','E','SB','Irr']),i%7+1]);}
  sl.oninput=()=>{f=sl.value/1000;auto=null;};
  $('#rw',c).onclick=()=>{auto=-1;ac();};
  $('#ff',c).onclick=()=>{auto=1;ac();};
  if(banged){$('#ff',c).disabled=false;done();} // 전에 빅뱅을 이미 봤다면(이전 버튼·새로고침·지도 왕복) 바로 통과
  const mix=(a,b,t)=>a.map((x,i)=>Math.round(lerp(x,b[i],t)));
  const heat=t=>{const st=[[30,42,107],[122,59,143],[255,140,70],[255,246,216]];const x=clamp(t,0,1)*3;const i=Math.min(2,Math.floor(x));return mix(st[i],st[i+1],x-i);};
  addTick(dt=>{
    if(auto){f=clamp(f+auto*dt*.28,0,1);sl.value=Math.round(f*1000);if(f<=0||f>=1)auto=null;}
    if(f<=0.01&&!flash&&!banged){banged=true;flash=1.2;sfx('boom');gain('m5-bang',10,sl);toast('빅뱅! 약 138억 년 전');burst(window.innerWidth/2,window.innerHeight/2,90);$('#ff',c).disabled=false;done();}
    const a=.02+.98*Math.pow(f,1.3);const hot=clamp(Math.log(1/a)/Math.log(50),0,1);
    const g=o.ctx,W=o.w,H=o.h;g.clearRect(0,0,W,H);const cx=W/2,cy=H/2,Rm=Math.min(W,H)*.44,r=Math.max(3,a*Rm);
    const inner=heat(hot+.15),edge=heat(hot);
    const gr=g.createRadialGradient(cx,cy,0,cx,cy,r);gr.addColorStop(0,`rgb(${inner})`);gr.addColorStop(1,`rgba(${edge},.85)`);
    g.fillStyle=gr;g.beginPath();g.arc(cx,cy,r,0,6.283);g.fill();
    g.save();g.globalAlpha=clamp((hot)*1.4,0,1)*.7;g.fillStyle=`rgb(${heat(hot)})`;g.filter='blur(14px)';g.beginPath();g.arc(cx,cy,r*1.08,0,6.283);g.fill();g.restore();
    const ga=clamp((f-.25)/.15,0,1);
    if(ga>0){g.globalAlpha=ga;pts.forEach(p=>g.drawImage(sprite(p[2],16,p[3],0),cx+p[0]*r-9,cy+p[1]*r-9,18,18));g.globalAlpha=1;}
    if(flash>0){flash-=dt;g.fillStyle=`rgba(255,250,230,${clamp(flash,0,1)})`;g.fillRect(0,0,W,H);}
    const ago=Math.round(138*(1-f));
    $('#tlab',c).textContent=f>=.999?'현재의 우주':f<=.001?'빅뱅 직후: 모든 물질과 공간이 한 점에 모인 매우 뜨거운 상태':`약 ${ago}억 년 전의 우주${f<.25?' (아직 은하가 생기기 전)':''}`;
    $('#gS',c).style.width=(a*100)+'%';$('#gT',c).style.width=(8+hot*92)+'%';$('#gD',c).style.width=(8+Math.pow(hot,.7)*92)+'%';
    g.fillStyle='#f7f4ff';g.font='16px Jua, sans-serif';g.textAlign='left';g.fillText(f>=.999?'현재':`약 ${ago}억 년 전`,12,24);
  });
}

/* ================= 미션 6: 건포도빵 ================= */
function breadSim(box,done){
  const c=card(`<h3>건포도빵 우주 모형</h3><p>빵 반죽(우주)에 건포도(은하)를 넣고 구우면 어떻게 될까요?</p>`);box.appendChild(c);
  const o=makeCanvas(c,240);
  c.insertAdjacentHTML('beforeend',`<div class="row"><button class="btn small" id="bake">오븐에 굽기</button><button class="btn ghost small" id="unbake">반죽으로 되돌리기</button></div>
   <div class="tbl-wrap"><table class="rec"><thead><tr><th></th><th>굽기 전</th><th>지금</th><th>늘어난 거리</th></tr></thead><tbody>
   <tr><th style="color:var(--mint)">가까운 건포도</th><td class="v" id="n0"></td><td class="v" id="n1"></td><td class="v" id="n2"></td></tr>
   <tr><th style="color:var(--butter)">먼 건포도</th><td class="v" id="f0"></td><td class="v" id="f1"></td><td class="v" id="f2"></td></tr></tbody></table></div>
   <div class="split"><div class="mini"><h4 class="hm">잘된 점</h4><p style="font-size:15px">빵이 부풀면 건포도 사이가 모두 멀어지고, 처음에 멀었던 건포도일수록 더 많이 멀어져서 우주 팽창을 쉽게 이해할 수 있어요.</p></div>
   <div class="mini"><h4 class="hp">고쳐야 할 점</h4><p style="font-size:15px">오븐에서 가열해야 해서, 우주도 뜨거워져서 팽창한다고 잘못 생각할 수 있어요. 또 빵은 끝(가장자리)이 있어요.</p></div></div>`);
  const raisins=[[-.62,-.15],[-.45,.22],[-.2,-.3],[.05,.1],[.25,-.25],[.48,.2],[.7,-.05],[-.05,.35],[.35,.4],[-.78,.12],[.6,-.32],[-.32,.02]];
  const near=[3,7],far=[9,6];let kf=1,tk=1,baked=false;
  $('#bake',c).onclick=()=>{tk=1.7;ac();};
  $('#unbake',c).onclick=()=>{tk=1;};
  const D=(i,j)=>Math.hypot((raisins[i][0]-raisins[j][0]),(raisins[i][1]-raisins[j][1])*.62)*4;
  const n0=D(...near),f0=D(...far);$('#n0',c).textContent=n0.toFixed(1)+' cm';$('#f0',c).textContent=f0.toFixed(1)+' cm';
  addTick(dt=>{
    kf+=(tk-kf)*Math.min(1,dt*1.6);if(Math.abs(tk-kf)<.003)kf=tk;
    if(kf>1.68&&!baked){baked=true;gain('m6-bake',10,$('#bake',c));toast('맛있게 부풀었어요!');done();}
    const g=o.ctx,W=o.w,H=o.h;g.clearRect(0,0,W,H);const cx=W/2,cy=H/2+6;const bw=Math.min(W*.27,130)*kf,bh=bw*.62;
    const hot=(kf-1)/.7;
    const gr=g.createRadialGradient(cx-bw*.3,cy-bh*.5,bw*.1,cx,cy,bw*1.1);gr.addColorStop(0,`rgb(${lerp(255,255,hot)|0},${lerp(236,214,hot)|0},${lerp(200,140,hot)|0})`);gr.addColorStop(1,`rgb(${lerp(230,205,hot)|0},${lerp(190,130,hot)|0},${lerp(150,70,hot)|0})`);
    g.fillStyle=gr;g.beginPath();g.ellipse(cx,cy,bw,bh,0,0,6.283);g.fill();
    g.strokeStyle='rgba(150,90,40,.35)';g.lineWidth=3;[-.4,0,.4].forEach(x=>{g.beginPath();g.moveTo(cx+bw*x-12,cy-bh*.55);g.quadraticCurveTo(cx+bw*x,cy-bh*.68,cx+bw*x+12,cy-bh*.55);g.stroke();});
    const pos=i=>[cx+raisins[i][0]*bw,cy+raisins[i][1]*bh*1.0];
    const line=(i,j,col)=>{const a=pos(i),b=pos(j);g.strokeStyle=col;g.lineWidth=2.5;g.setLineDash([5,4]);g.beginPath();g.moveTo(...a);g.lineTo(...b);g.stroke();g.setLineDash([]);};
    line(...near,'#3fae8c');line(...far,'#c99a3a');
    raisins.forEach((r,i)=>{const [x,y]=pos(i);g.fillStyle='#4a2340';g.beginPath();g.ellipse(x,y,7,5,.4,0,6.283);g.fill();g.fillStyle='rgba(255,255,255,.35)';g.beginPath();g.arc(x-2,y-2,1.6,0,6.283);g.fill();});
    g.fillStyle='#bdb9ea';g.font='14px Jua, sans-serif';g.textAlign='left';g.fillText(kf>1.6?'다 구운 빵':kf>1.02?'부푸는 중…':'반죽',12,22);
    g.textAlign='right';g.fillText('건포도 크기는 그대로!',W-12,22);
    const n1=n0*kf,f1=f0*kf;$('#n1',c).textContent=n1.toFixed(1)+' cm';$('#f1',c).textContent=f1.toFixed(1)+' cm';$('#n2',c).textContent='+'+(n1-n0).toFixed(1);$('#f2',c).textContent='+'+(f1-f0).toFixed(1);
  });
}

 ]},
 {id:'m3',title:'풍선 우주 실험',src:'붙임딱지를 붙인 풍선 불기',steps:[
   {say:'이제 직접 실험! 풍선 <b>표면</b>은 우주, 붙임딱지는 <b>은하</b>야. 풍선 속은 우주가 아니야. 우주는 풍선 <b>껍질 위</b>뿐이야.',body:b=>b.appendChild(card(`<h3>실험 방법</h3><p>① 풍선을 조금 불고 붙임딱지 A, B, C를 붙여요.</p><p>② 붙임딱지 사이의 거리를 재요. <b class="hs">(가)</b></p><p>③ 풍선을 더 크게 불고 다시 거리를 재요. <b class="hp">(나)</b></p><p>④ 거리 변화를 계산해요.</p><p class="note">풍선 표면 위를 기어다니는 개미를 떠올려 보세요. 개미에게는 표면의 앞뒤좌우만 세상이고, 풍선 속으로 들어가는 방향은 없어요. 다음 화면의 ‘단면으로 보기’로 확인할 수 있어요.</p>`))},
   {say:'①, ② 버튼을 차례로 눌러 풍선을 불면 표에 거리가 기록돼. 그다음 <b>거리 변화</b>를 계산해 적어 봐!',gate:true,body:(b,d)=>balloonSim(b,d)},
   qstep('실험 결과를 정리해 보자.',{id:'m3-q1',type:'blank',prompt:'풍선 표면은 ( {0} ), 붙임딱지는 ( {1} )를 의미한다. 풍선(우주)이 팽창하여 붙임딱지(은하) 사이의 거리가 ( {2} ).',blanks:[{opts:['우주','은하','별'],ans:0},{opts:['우주','은하','행성'],ans:1},{opts:['멀어진다','가까워진다','그대로다'],ans:0}],hint:'풍선 = 우주, 붙임딱지 = 은하였어요.',explain:'풍선 표면 = 우주, 붙임딱지 = 은하. 우주가 팽창하면 은하 사이의 거리가 멀어져요.'}),
   qstep('이번엔 결론을 정리할 차례!',{id:'m3-q2',type:'blank',prompt:'멀리 떨어져 있는 은하일수록 더 ( {0} ) 멀어진다. 은하들이 서로 멀어지므로, 팽창하는 우주에는 ( {1} )이 없다.',blanks:[{opts:['빨리','천천히'],ans:0},{opts:['중심','은하'],ans:0}],hint:'A~C는 처음 8 cm에서 16 cm가 되어 8 cm나 늘었어요.',explain:'멀리 있는 은하일수록 더 빨리 멀어지고, 어느 붙임딱지도 기준이 아니었으니 우주에는 중심이 없어요.'}),
   qstep('마지막으로 헷갈리기 쉬운 문제!',{id:'m3-q3',type:'mc',prompt:'풍선 모형에서 풍선의 <b>속(안쪽 공간)</b>은 무엇을 나타낼까요?',options:['우주의 중심','아무것도 나타내지 않는다 (모형에서 우주는 풍선 표면뿐)','블랙홀','우리은하'],answer:1,hints:['풍선 속이 우주의 중심이라면, 우주에 중심이 있다는 뜻이 되어 버려요.',null,'블랙홀은 이 모형과 관계없어요.','우리은하는 붙임딱지 중 하나예요.'],explain:'이 모형에서 우주는 풍선 표면이에요. 표면 위에는 “여기가 중심”이라 할 곳이 없어요. 풍선 속은 모형 밖이라서 우주의 어느 곳도 아니에요.'})
 ]},
 {id:'m4',title:'누가 우주의 중심일까?',src:'관측자를 바꿔 가며 살펴보기',steps:[
   {say:'은하 C가 한가운데 있네? 그럼 C가 <b>우주의 중심</b>일까? 먼저 네 생각을 골라 봐.',gate:true,body:(b,d)=>{
      const c=card(`<h3>예측하기 (점수 없음)</h3><div class="figwrap"><img class="fig" alt="은하 A~E 배치도" src="${galaxyFieldImg()}" width="300" height="190"></div><div class="vote"><button data-v="yes">C가 중심이다</button><button data-v="no">C도 중심이 아니다</button></div><p class="note" id="c4n"></p>`);b.appendChild(c);
      const mark=()=>{$$('.vote button',c).forEach(x=>x.classList.toggle('sel',x.dataset.v===S.c4));if(S.c4){$('#c4n',c).textContent='좋아요! 다음 화면에서 직접 확인해 봐요.';d();}};
      $$('.vote button',c).forEach(x=>x.onclick=()=>{S.c4=x.dataset.v;save();sfx('pop');mark();});mark();}},
   {say:'은하를 <b>눌러서</b> 관측자로 정해 봐. 그 은하에서 보면 다른 은하들이 어떻게 움직이는지 살펴보고, 다섯 은하 모두 해 봐!',gate:true,body:(b,d)=>observerSim(b,d)},
   qstep('방금 본 걸 떠올려서 풀어 봐!',{id:'m4-q1',type:'mc',prompt:'우주에서 서로 멀리 떨어져 있는 은하의 모습이다. 이에 대한 설명으로 옳은 것은?',fig:Q2FIG(),keys:['①','②','③','④','⑤'],options:['은하 A와 E 사이의 거리는 일정하다.','은하 B와 D는 서로 가까워지고 있다.','은하 C는 우주의 중심에 해당한다.','은하 D에서 다른 은하들을 관측하면 은하 C는 가까워지고, 은하 A, B, E는 멀어진다.','은하 E에서 다른 은하들을 관측하면 모든 은하들이 멀어진다.'],answer:4,hints:['우주가 팽창하면 모든 은하 사이의 거리가 멀어져요.','가까워지는 은하는 없었어요.','C를 관측자로 골랐을 때와 E를 골랐을 때가 똑같았죠?','D에서 볼 때 C도 멀어졌어요.'],explain:'어느 은하에서 관측해도 다른 모든 은하가 멀어져요. 그래서 C가 가운데 있어 보여도 우주의 중심이라고 할 수 없어요.'}),
   qstep('O, X로 답해 봐!',{id:'m4-q2',type:'ox',prompt:'우리은하에서 관측하면 다른 은하들이 모두 멀어진다. 따라서 우리은하는 우주의 중심이다.',options:['O','X'],answer:1,hint:'다른 은하에 사는 외계인이 관측해도 똑같은 모습이 보일 거예요.',explain:'어느 은하에서 관측해도 모든 은하가 멀어져요. 우리은하만 특별한 게 아니니까 우리은하가 우주의 중심이라고 말할 수 없어요.'})
 ]},
 {id:'m5',title:'시간을 거꾸로!',src:'타임머신을 타고 빅뱅까지',steps:[
   {say:'우주가 계속 팽창해 왔다면, 시간을 <b>거꾸로</b> 돌리면 어떻게 될까? 슬라이더를 왼쪽으로 끝까지 밀어 봐!',gate:true,body:(b,d)=>rewindSim(b,d)},
   qstep('생각하는 힘을 키우는 질문이야.',{id:'m5-q1',type:'mc',prompt:'팽창하는 우주에서 시간을 거꾸로 되돌린다고 가정할 때, 우주의 크기는 어떻게 될까요?',options:['점점 커진다','점점 작아진다','변하지 않는다'],answer:1,hint:'타임머신 슬라이더를 왼쪽으로 밀 때 무슨 일이 있었나요?',explain:'우주는 지금도 커지고 있으니, 시간을 거꾸로 돌리면 우주는 점점 작아져요.'}),
   qstep('게이지를 떠올려 봐!',{id:'m5-q2',type:'mc',prompt:'아주 먼 과거의 우주는 지금과 비교해 어땠을까요?',options:['온도와 밀도가 모두 낮았다','온도와 밀도가 모두 높았다','온도는 낮고 밀도는 높았다','지금과 똑같았다'],answer:1,hint:'모든 물질이 아주 좁은 곳에 꽉 모여 있었어요.',explain:'과거의 우주는 지금보다 훨씬 작고, 온도와 밀도가 매우 높았어요.'}),
   qstep('우주의 나이 문제!',{id:'m5-q3',type:'mc',prompt:'대폭발(빅뱅)은 지금으로부터 약 몇 년 전에 일어났다고 알려져 있을까요?',options:['약 46억 년 전','약 138억 년 전','약 1억 년 전','약 1000억 년 전'],answer:1,hints:['46억 년은 지구와 태양계의 나이예요.',null,'공룡이 살던 때쯤이에요. 우주는 훨씬 오래됐어요.','그건 너무 많아요!'],explain:'빅뱅은 약 138억 년 전에 일어났어요. 그때부터 우주는 계속 팽창하며 크기가 커지고 온도와 밀도가 낮아졌어요.'}),
   qstep('대폭발 우주론 빈칸을 채워 보자!',{id:'m5-q4',type:'blank',prompt:'처음에 고온·고밀도의 물질이 대폭발한 후 계속 팽창하여 오늘날의 우주가 만들어졌다는 이론을 ( {0} ) 우주론이라고 한다. 팽창하고 있는 우주의 중심은 ( {1} ), 현재에도 계속 ( {2} )하고 있다.',blanks:[{opts:['대폭발(빅뱅)','도플러'],ans:0},{opts:['없으며','있으며'],ans:0},{opts:['팽창','수축'],ans:0}],hint:'우주에는 중심이 없고, 지금도 커지고 있어요.',explain:'대폭발(빅뱅) 우주론! 팽창하는 우주의 중심은 없으며, 지금도 계속 팽창하고 있어요.'})
 ]},
 {id:'m6',title:'최종 도전: 우주 박사 시험',src:'건포도빵 모형과 종합 퀴즈',steps:[
   {say:'마지막 미션이야! 풍선 말고 다른 모형도 있어. <b>건포도빵</b>을 구워 보자!',gate:true,body:(b,d)=>breadSim(b,d)},
   qstep('건포도빵 문제부터!',{id:'m6-q1',type:'mc',prompt:'건포도빵 모형에서 <b>건포도</b>는 무엇에 비유할 수 있을까요?',options:['우주','은하','빛','블랙홀'],answer:1,hint:'풍선 실험의 붙임딱지와 같은 역할이에요.',explain:'빵 반죽은 우주, 건포도는 은하예요. 빵이 부풀면 건포도 사이가 멀어지듯, 우주가 팽창하면 은하 사이가 멀어져요.'}),
   qstep('모형의 아쉬운 점도 생각해 보자.',{id:'m6-q2',type:'mc',prompt:'건포도빵 모형의 <b>고쳐야 할 점</b>으로 알맞은 것은?',options:['건포도 사이가 멀어지는 모습을 볼 수 없다.','오븐에서 가열하므로, 우주도 뜨거워져서 팽창한다고 잘못 생각할 수 있다.','처음 거리가 먼 건포도일수록 덜 멀어진다.','건포도의 크기가 빵과 함께 커진다.'],answer:1,hint:'빵을 만들려면 무엇이 꼭 필요했나요?',explain:'빵은 열을 받아 부풀지만, 우주는 뜨거워져서 팽창하는 것이 아니에요. 모형에는 늘 실제와 다른 점이 있어요.'}),
   qstep('맞는 것을 모두 골라 봐.',{id:'m6-q3',type:'multi',prompt:'풍선 표면에 동전을 붙인 다음 풍선을 크게 불었다. 풍선 표면을 우주, 동전을 은하라고 할 때, 실험을 통해 알 수 있는 사실을 <b>모두</b> 고르면?',fig:BALLOON_FIG,keys:['ㄱ','ㄴ','ㄷ'],options:['우주가 팽창하면 은하들은 서로 멀어진다.','우주는 특별한 중심 없이 팽창한다.','거리가 먼 은하일수록 느리게 멀어진다.'],answer:[0,1],hint:'ㄷ을 다시 읽어 보세요. 먼 은하일수록 ‘느리게’일까요?',explain:'정답은 ㄱ, ㄴ이에요. 거리가 먼 은하일수록 더 빠르게 멀어지므로 ㄷ은 틀렸어요.'}),
   qstep('핵심 개념 확인!',{id:'m6-q4',type:'mc',prompt:'멀리 떨어져 있는 은하들일수록 서로 더 (　　) 멀어진다.',options:['빨리','천천히'],answer:0,hint:'풍선 실험에서 A~C가 가장 많이 벌어졌어요.',explain:'멀리 떨어진 은하일수록 더 빨리 멀어져요.'}),
   qstep('계속 가 보자!',{id:'m6-q5',type:'mc',prompt:'은하들이 서로 멀어지는 까닭은 무엇일까요?',options:['은하들이 서로 밀어내기 때문','우주가 팽창하기 때문','우리은하가 다른 은하를 밀어내기 때문','은하가 스스로 빛을 내기 때문'],answer:1,hint:'붙임딱지는 가만히 있었는데 무엇이 커졌나요?',explain:'은하가 스스로 달려가는 것이 아니라, 우주(공간)가 팽창해서 은하 사이가 멀어져요.'}),
   qstep('O, X 문제!',{id:'m6-q6',type:'ox',prompt:'팽창하는 우주에는 중심이 있다.',options:['O','X'],answer:1,hint:'미션 4에서 다섯 은하 모두 관측자가 되어 봤죠?',explain:'팽창하는 우주에는 중심이 없어요.'}),
   qstep('붙임딱지 크기, 기억나?',{id:'m6-q7',type:'mc',prompt:'풍선이 커져도 붙임딱지의 크기는 그대로였어요. 이것은 실제 우주에서 무엇을 뜻할까요?',options:['은하도 우주처럼 점점 커진다.','은하 자체가 커지는 것이 아니라 은하 사이의 공간이 늘어난다.','은하가 점점 작아진다.','은하의 개수가 점점 늘어난다.'],answer:1,hint:'늘어난 것은 붙임딱지가 아니라 풍선 고무였어요.',explain:'우주가 팽창할 때 은하 자체가 부풀지는 않아요. 은하 사이의 공간이 늘어나요.'}),
   qstep('정말 마지막 문제! 도플러 효과 복습이야.',{id:'m6-q8',type:'mc',prompt:'대부분의 외부 은하에서 적색 편이가 나타나는 것은 무엇을 뜻할까요?',options:['은하들이 우리에게 다가오고 있다.','은하들이 우리에게서 멀어지고 있다.','은하들의 온도가 매우 낮다.','은하들이 붉은 별로만 이루어져 있다.'],answer:1,hint:'슬라이더를 ‘멀어짐’ 쪽으로 밀면 줄이 빨간 쪽으로 갔어요.',explain:'적색 편이는 은하가 멀어지고 있다는 증거예요. 그리고 이것이 우주 팽창의 증거가 되었어요.'})
 ]}
];

/* ================= 시작 ================= */
$('#homeBtn').onclick=showMap;
$('#bookBtn').onclick=showBook;
$('#sndBtn').onclick=()=>{S.sound=!S.sound;save();hud();if(S.sound){ac();sfx('pop');}};
window.addEventListener('resize',()=>{fitSky();fitFx();});
fitSky();fitFx();hud();showMap();requestAnimationFrame(loop);
})();
</script>
